<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
    </marker>
  </defs>

  <rect width="1100" height="640" rx="12" fill="#ffffff"/>
  <text x="550" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#232F3E">hono-serverless-floci · Architecture</text>

  <!-- AWS cloud boundary -->
  <rect x="230" y="40" width="835" height="450" rx="8" fill="#F8F9FA" stroke="#232F3E" stroke-width="2"/>
  <text x="246" y="62" font-size="13" font-weight="700" fill="#232F3E">AWS Cloud · us-east-1 (or local Floci emulator, account 000000000000)</text>

  <!-- Client -->
  <rect x="50" y="200" width="64" height="64" rx="6" fill="#232F3E"/>
  <circle cx="82" cy="224" r="9" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M64,252 Q82,232 100,252" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="82" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#232F3E">Client</text>
  <text x="82" y="302" text-anchor="middle" font-size="11" fill="#555">curl / browser / app</text>

  <!-- API Gateway -->
  <rect x="290" y="200" width="64" height="64" rx="6" fill="#E7157B"/>
  <path d="M308,218 L322,232 L308,246 M336,218 L322,232 L336,246" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="322" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#232F3E">API Gateway</text>
  <text x="322" y="302" text-anchor="middle" font-size="11" fill="#555">HTTP API (v2)</text>
  <text x="322" y="317" text-anchor="middle" font-size="11" fill="#555">stage $default · auto-deploy</text>
  <text x="322" y="332" text-anchor="middle" font-size="11" fill="#555">route ANY /{proxy+}</text>
  <text x="322" y="347" text-anchor="middle" font-size="11" fill="#555">AWS_PROXY · payload 2.0</text>

  <!-- Client <-> API GW -->
  <line x1="114" y1="224" x2="288" y2="224" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="201" y="216" text-anchor="middle" font-size="11" fill="#232F3E">① HTTPS request</text>
  <line x1="288" y1="246" x2="114" y2="246" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="201" y="262" text-anchor="middle" font-size="11" fill="#232F3E">⑧ HTTP response</text>

  <!-- API GW <-> Lambda -->
  <line x1="354" y1="215" x2="428" y2="215" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="391" y="205" text-anchor="middle" font-size="10" fill="#232F3E">② JSON event</text>
  <line x1="428" y1="250" x2="354" y2="250" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="391" y="266" text-anchor="middle" font-size="10" fill="#232F3E">⑦ result JSON</text>

  <!-- Lambda container -->
  <rect x="430" y="80" width="620" height="320" rx="8" fill="#FFF7F0" stroke="#ED7100" stroke-width="2"/>
  <rect x="446" y="92" width="44" height="44" rx="5" fill="#ED7100"/>
  <path d="M458,126 L470,98 L476,98 L466,126 Z M470,126 L477,112 L482,126 Z" fill="#fff"/>
  <text x="500" y="110" font-size="14" font-weight="700" fill="#232F3E">AWS Lambda · hono-api</text>
  <text x="500" y="127" font-size="11" fill="#555">nodejs22.x · 256 MB · 15 s timeout · handler index.handler (dist/index.mjs)</text>

  <!-- Inside Lambda: pipeline -->
  <rect x="450" y="150" width="280" height="50" rx="6" fill="#fff" stroke="#ED7100"/>
  <text x="462" y="170" font-size="12" font-weight="700" fill="#232F3E">③ @hono/aws-lambda · handle(app)</text>
  <text x="462" y="187" font-size="11" fill="#555">LambdaEvent → Web Standard Request</text>

  <rect x="450" y="215" width="280" height="50" rx="6" fill="#fff" stroke="#ED7100"/>
  <text x="462" y="235" font-size="12" font-weight="700" fill="#232F3E">④ Hono router + middleware</text>
  <text x="462" y="252" font-size="11" fill="#555">matches method + path, injects c.env bindings</text>

  <rect x="450" y="280" width="280" height="50" rx="6" fill="#fff" stroke="#ED7100"/>
  <text x="462" y="300" font-size="12" font-weight="700" fill="#232F3E">⑤ Route handler</text>
  <text x="462" y="317" font-size="11" fill="#555">returns c.text() / c.json() → Web Response</text>

  <rect x="450" y="345" width="280" height="46" rx="6" fill="#fff" stroke="#ED7100"/>
  <text x="462" y="365" font-size="12" font-weight="700" fill="#232F3E">⑥ @hono/aws-lambda</text>
  <text x="462" y="381" font-size="11" fill="#555">Response → { statusCode, headers, body }</text>

  <line x1="590" y1="200" x2="590" y2="213" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="265" x2="590" y2="278" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="330" x2="590" y2="343" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right panel: routes -->
  <rect x="760" y="150" width="270" height="130" rx="6" fill="#fff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="774" y="170" font-size="12" font-weight="700" fill="#232F3E">Routes registered in src/index.ts</text>
  <text x="774" y="192" font-size="11" fill="#232F3E" font-family="Consolas, monospace">GET  /               → text</text>
  <text x="774" y="212" font-size="11" fill="#232F3E" font-family="Consolas, monospace">GET  /hello/:name    → json</text>
  <text x="774" y="232" font-size="11" fill="#232F3E" font-family="Consolas, monospace">POST /echo           → json</text>
  <text x="774" y="252" font-size="11" fill="#232F3E" font-family="Consolas, monospace">GET  /whoami         → json</text>
  <text x="774" y="270" font-size="10" fill="#777">(Lambda context introspection)</text>

  <!-- Right panel: bindings -->
  <rect x="760" y="295" width="270" height="96" rx="6" fill="#fff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="774" y="315" font-size="12" font-weight="700" fill="#232F3E">Hono Bindings (c.env)</text>
  <text x="774" y="337" font-size="11" fill="#232F3E" font-family="Consolas, monospace">event         → raw API GW event</text>
  <text x="774" y="357" font-size="11" fill="#232F3E" font-family="Consolas, monospace">lambdaContext → requestId,</text>
  <text x="774" y="374" font-size="11" fill="#232F3E" font-family="Consolas, monospace">                ARN, memory, ...</text>

  <!-- IAM + CloudWatch -->
  <rect x="470" y="418" width="56" height="56" rx="6" fill="#DD344C"/>
  <circle cx="498" cy="436" r="7" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M484,462 L484,452 Q498,444 512,452 L512,462 Z" fill="#fff"/>
  <text x="498" y="488" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">IAM Role</text>

  <rect x="800" y="418" width="56" height="56" rx="6" fill="#E7157B"/>
  <circle cx="828" cy="446" r="14" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M828,446 L828,436 M828,446 L836,450" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="828" y="488" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">CloudWatch Logs</text>

  <line x1="498" y1="418" x2="498" y2="401" stroke="#232F3E" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="512" y="412" font-size="10" fill="#555">execution role (lambda-role)</text>
  <line x1="828" y1="401" x2="828" y2="416" stroke="#232F3E" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="842" y="412" font-size="10" fill="#555">stdout / stderr, REPORT lines</text>

  <!-- Build and deploy pipeline -->
  <rect x="20" y="515" width="1060" height="110" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="36" y="538" font-size="13" font-weight="700" fill="#232F3E">Developer workstation · build and deploy pipeline (pnpm deploy)</text>

  <rect x="40" y="556" width="170" height="52" rx="6" fill="#fff" stroke="#232F3E"/>
  <text x="125" y="577" text-anchor="middle" font-size="12" font-weight="700" fill="#232F3E">src/index.ts</text>
  <text x="125" y="594" text-anchor="middle" font-size="10" fill="#555">Hono app (TypeScript)</text>

  <rect x="250" y="556" width="170" height="52" rx="6" fill="#fff" stroke="#232F3E"/>
  <text x="335" y="577" text-anchor="middle" font-size="12" font-weight="700" fill="#232F3E">tsc (typecheck)</text>
  <text x="335" y="594" text-anchor="middle" font-size="10" fill="#555">strict, noEmit</text>

  <rect x="460" y="556" width="190" height="52" rx="6" fill="#fff" stroke="#232F3E"/>
  <text x="555" y="577" text-anchor="middle" font-size="12" font-weight="700" fill="#232F3E">esbuild bundle</text>
  <text x="555" y="594" text-anchor="middle" font-size="10" fill="#555">ESM, node22 → dist/index.mjs</text>

  <rect x="690" y="556" width="170" height="52" rx="6" fill="#fff" stroke="#232F3E"/>
  <text x="775" y="577" text-anchor="middle" font-size="12" font-weight="700" fill="#232F3E">function.zip</text>
  <text x="775" y="594" text-anchor="middle" font-size="10" fill="#555">Compress-Archive</text>

  <rect x="900" y="556" width="165" height="52" rx="6" fill="#fff" stroke="#ED7100" stroke-width="2"/>
  <text x="982" y="577" text-anchor="middle" font-size="12" font-weight="700" fill="#232F3E">aws lambda</text>
  <text x="982" y="594" text-anchor="middle" font-size="10" fill="#555">update-function-code</text>

  <line x1="210" y1="582" x2="248" y2="582" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="582" x2="458" y2="582" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="582" x2="688" y2="582" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="582" x2="898" y2="582" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
